[project]
name = "ember"
version = "0.1.0"
description = "read-only alert reporter: host/container metrics → LLM triage → one-way sinks"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai-slim[openai]>=2.1.0",
    "docker>=7.2.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "httpx>=0.28.0",
    "aiosmtplib>=4.0.0",
    "feedparser>=6.0.14",
    "bs4>=0.0.2",
    "starlette>=1.10.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "api", "daemon", "sinks"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
