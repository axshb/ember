[project]
name = "ember"
version = "0.1.0"
description = "ember agent + monitoring daemon, single process"
requires-python = ">=3.14"
dependencies = [
    "pydantic-ai-slim[openai]>=2.1.0",
    "pydantic-ai-harness>=0.7.0",
    "playwright>=1.52.0",
    "docker>=7.2.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.4",
    "discord-py>=2.7.1",
]

[project.scripts]
firekeep = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "daemon"]
