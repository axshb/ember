# ──────────────────────────────────────────────
# Ember configuration
# Copy this file to config.toml (repo root) and fill in your values.
# ──────────────────────────────────────────────

[polling]
# Interval in seconds between metric collection cycles
interval = 10

# ── RSS / Atom ───────────────────────────────
# Independent of alerts: new entries go to the agent, then all enabled sinks.
[rss]
# Empty list disables RSS. Example: Ubuntu Security Notices.
feeds = ["https://ubuntu.com/security/notices/rss.xml"]
interval = 900 # seconds between feed checks, independent of metric polling
timeout = 30 # HTTP timeout in seconds
batch_size = 10 # entries per agent report (1–10)
state_path = "data/rss.sqlite3" # durable deduplication; keep across restarts
# false: first successful fetch establishes a baseline without old-item spam.
# true: report all entries currently in a newly configured feed.
send_existing = false

# ── Alerts ───────────────────────────────────
# Each alert checks a metric path against a threshold.
# Paths: system.cpu.percent, system.memory.percent,
#        system.disks.<dev>.percent,
#        containers.<n>.cpu_percent, containers.<n>.memory_percent

[[alerts]]
path = "system.cpu.percent"
op = ">"
value = 80
# Cooldown in minutes before this alert can fire again
cooldown = 5

[[alerts]]
path = "system.memory.percent"
op = ">"
value = 80
cooldown = 5

# ── Agent ────────────────────────────────────
[agent]
# OpenRouter API key
api_key = "YOUR_OPENROUTER_API_KEY"
# Model to use (see https://openrouter.ai/models)
model = "z-ai/glm-5.3-flash"
# Hard cap on tool calls (and requests) per alert or RSS report
max_tool_calls = 15

[agent.shell]
# Commands the agent may run while triaging alerts (investigation is read-only)
allowed_commands = [
  "ls", "cat", "grep", "find", "rg", "head", "tail", "wc",
  "ps", "df", "du", "free", "uptime", "stat", "awk",
  "docker", "systemctl", "journalctl", "dmesg",
  "ss", "ping", "curl", "uname", "hostname", "id",
]
denied_commands = []
denied_operators = []
default_timeout = 30.0
max_output_chars = 50000

[agent.filesystem]
root_dir = "/host"
denied_patterns = [".env", ".env.*", "*.pem", "*.key", "**/secrets*", ".git/*"]

# ── Sinks ────────────────────────────────────
# Every sink is one-way: ember sends reports, it never listens for replies.
# At least one must be enabled for ember to do anything useful.

[sinks]
discord = true
email = false
slack = false    # not implemented yet
telegram = false # not implemented yet

# ── Discord ──────────────────────────────────
# Required if sinks.discord = true.
# Create one in the notification channel: Settings → Integrations → Webhooks

[discord]
webhook_url = "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_WEBHOOK_TOKEN"

# ── Email ────────────────────────────────────
# Required if sinks.email = true.

[email]
host = "smtp.example.com"
port = 587
username = "you@example.com"
password = "YOUR_SMTP_PASSWORD"
from = "ember@example.com"
to = "you@example.com"
# STARTTLS on port 587; set false only for plain SMTP (e.g. port 25)
starttls = true
