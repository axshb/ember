services:
  ember:
    build: .
    restart: unless-stopped
    pid: host

    volumes:
      # Docker socket — lets the daemon collect container metrics
      - /var/run/docker.sock:/var/run/docker.sock:ro

      # Host filesystem read-only at /host — agent file browsing tools
      - /:/host:ro

      # Config (gitignored, contains secrets) — mount from host
      - ./config.toml:/app/config.toml:ro

      # Prompts — read-only, so edits apply without a rebuild.
      # prompts/*.md (gitignored) override same-named files in prompts/defaults/
      - ./prompts:/app/prompts:ro

    # Config comes from TOML only, no env fallbacks.
    # If config.toml doesn't exist, the app will print a helpful error.
