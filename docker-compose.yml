services:
  ember:
    build: .
    restart: unless-stopped
    pid: host
    pids_limit: 128
    mem_limit: 256m
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    cap_drop:
      - ALL
    cap_add:
      - SETUID
      - SETGID
      - KILL
    security_opt:
      - no-new-privileges:true

    # localhost only, published ports bypass ufw
    ports:
      - "127.0.0.1:7340:8080"

    environment:
      - DOCKER_HOST=unix:///run/ember/docker.sock
      - EMBER_DB=/data/ember.db
      - EMBER_HOST=0.0.0.0
      # hostnames used via a reverse proxy / tailscale
      # - EMBER_ALLOWED_HOSTS=ember.example.ts.net

    volumes:
      # inside root-only /run/ember, so agent shell commands can't reach it
      - /var/run/docker.sock:/run/ember/docker.sock:ro

      # host filesystem for agent shell commands
      - /:/host:ro

      # config, prompts and history (sqlite), deleted only by `down -v`
      - ember-data:/data

volumes:
  ember-data:
